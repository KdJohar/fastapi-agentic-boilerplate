name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Verify dependency lock
        run: uv lock --check --python 3.12
      - name: Install dependencies
        run: uv sync --locked --dev --python 3.12
      - name: Verify code
        run: make verify
      - name: Audit dependencies
        run: uv run pip-audit

  commit-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/validate_commit_message.py
          --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Validate pushed commit messages
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${AFTER}"
          else
            range="${AFTER}^!"
          fi
          python3 scripts/validate_commit_message.py --range "$range"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
